
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Magangkuy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <div class="brand">
                <div class="logo">m</div>
                <span>magangkuy</span>
            </div>

            <h1>
                Magang impian,<br>
                selangkah lebih dekat.
            </h1>
        </header>

        <!-- FORM LOGIN -->
        <main class="login">
            <h2>Selamat datang kembali</h2>

            <p class="subtitle">
                Masuk untuk melanjutkan perjalanan magangmu.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="nama@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Kata sandi</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="password"
                            placeholder="Masukkan kata sandi"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="show-password"
                        >
                            Tampilkan
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox">
                        Ingat saya
                    </label>

                    <a href="#lupa-password">
                        Lupa kata sandi?
                    </a>
                </div>

                <button type="submit" class="btn-login">
                    Masuk
                </button>

            </form>

            <p class="register">
                Baru di magangkuy?
                <a href="#daftar">Buat akun</a>
            </p>
        </main>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="footer-links">
                <a href="#privasi">Kebijakan privasi</a>
                <span>·</span>
                <a href="#bantuan">Bantuan</a>
            </div>

            <p class="copyright">
                © 2026 magangkuy · Portal magang mahasiswa ITTS
            </p>
        </footer>

    </div>

    <script>
        const password = document.getElementById("password");
        const toggle = document.getElementById("togglePassword");

        toggle.addEventListener("click", function () {
            if (password.type === "password") {
                password.type = "text";
                toggle.textContent = "Sembunyikan";
            } else {
                password.type = "password";
                toggle.textContent = "Tampilkan";
            }
        });

        document.getElementById("loginForm").addEventListener(
            "submit",
            function (event) {
                event.preventDefault();
                alert("Form login siap dihubungkan ke backend.");
            }
        );
    </script>

</body>
</html>
